name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish the site and the x402 skill store (Netlify Functions)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 774dae81-dcf7-42e4-b800-fad91c6ba090
        run: |
          npm ci
          mkdir -p public
          cp index.html review.html style.css wallet.js wallet-adapter.min.js web3.min.js favicon.png apple-touch-icon.png _redirects public/
          if [ -d assets/samples ]; then mkdir -p public/assets && cp -r assets/samples public/assets/; fi
          npx --yes netlify-cli@27.16.2 deploy --prod --no-build --dir=public --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message "Deploy from GitHub ${GITHUB_SHA::7}"
